<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>ParkCast Web Screen</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05070D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #join{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
  #join h1{font-size:34px;margin:0;letter-spacing:-.5px}
  #join p{color:#98A0AF;margin:0;max-width:440px;line-height:1.5}
  #code{font-size:40px;letter-spacing:12px;text-align:center;width:300px;padding:14px;border-radius:16px;border:2px solid #27304A;background:#0E1525;color:#fff}
  #code:focus{outline:none;border-color:#1A73E8}
  button{font-size:18px;font-weight:700;padding:14px 40px;border-radius:999px;border:0;background:#1A73E8;color:#fff;cursor:pointer}
  #error{color:#FF8A80;min-height:22px}
  #stage{position:absolute;inset:0;display:none}
  #stage iframe,#stage video,#stage img{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
  #stage.fill video,#stage.fill img{object-fit:cover}
  #idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(circle at 30% 20%,#14213D,#05070D 70%)}
  #clock{font-size:min(22vw,180px);font-weight:200;letter-spacing:-4px;line-height:1}
  #greeting{font-size:28px;font-weight:600}
  #weather,#note{font-size:20px;color:#98A0AF}
  #paused{position:absolute;right:24px;bottom:24px;background:rgba(0,0,0,.6);padding:10px 18px;border-radius:999px;font-weight:700;display:none}
  #link{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:none}
</style>
</head>
<body>
<section id="join">
  <h1>ParkCast Web Screen</h1>
  <p>On your iPhone open ParkCast › Settings › Web screen and type the 6-digit code here.</p>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
  <button id="connect">Connect</button>
  <div id="error"></div>
</section>
<section id="stage">
  <div id="idle"><div id="clock"></div><div id="greeting"></div><div id="weather"></div><div id="note"></div></div>
  <div id="media"></div>
  <div id="paused">Paused</div>
  <a id="link" target="_blank" rel="noopener noreferrer"><button>Open page</button></a>
</section>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var socket = null;
  var code = new URLSearchParams(location.search).get('code') || localStorage.getItem('parkcast.code') || '';
  var currentKey = '';
  var retry = null;

  function isHttp(url) { return typeof url === 'string' && /^https?:\/\//i.test(url); }
  function youtubeId(url) {
    var match = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i);
    return match ? match[1] : null;
  }
  function isVideoFile(url) { return /\.(mp4|m4v|mov|webm|m3u8)(\?|#|$)/i.test(url); }

  function tick() {
    var now = new Date();
    $('clock').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  setInterval(tick, 1000); tick();

  function render(state) {
    state = state || {};
    var media = state.media && isHttp(state.media.uri) ? state.media : null;
    var stage = $('stage');
    stage.classList.toggle('fill', !!state.fill);
    $('greeting').textContent = state.greeting || '';
    $('weather').textContent = state.weather || '';
    $('note').textContent = state.localOnly ? 'Playing from iPhone on CarPlay' : '';
    $('paused').style.display = media && state.playing === false ? 'block' : 'none';

    var active = media && ['video', 'web', 'photo', 'slideshow'].indexOf(state.mode) >= 0;
    $('idle').style.display = active ? 'none' : 'flex';
    $('link').style.display = 'none';

    var key = active ? state.mode + '|' + media.uri : '';
    var host = $('media');
    if (key !== currentKey) {
      currentKey = key;
      host.textContent = '';
      if (active) host.appendChild(buildElement(state.mode, media));
    }
    var element = host.firstChild;
    if (element && element.tagName === 'VIDEO') {
      if (state.playing === false) element.pause(); else element.play().catch(function () {});
    } else if (element && element.dataset.youtube) {
      element.contentWindow && element.contentWindow.postMessage(JSON.stringify({ event: 'command', func: state.playing === false ? 'pauseVideo' : 'playVideo', args: [] }), '*');
    }
    if (element && element.tagName === 'IFRAME' && !element.dataset.youtube) {
      $('link').href = media.uri;
      $('link').style.display = 'block';
    }
  }

  function buildElement(mode, media) {
    if (mode === 'photo' || mode === 'slideshow') {
      var img = document.createElement('img');
      img.src = media.uri; img.alt = media.title || '';
      return img;
    }
    var id = youtubeId(media.uri);
    if (id) {
      var yt = document.createElement('iframe');
      yt.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&playsinline=1&enablejsapi=1&rel=0';
      yt.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      yt.dataset.youtube = '1';
      return yt;
    }
    if (isVideoFile(media.uri)) {
      var video = document.createElement('video');
      video.src = media.uri; video.autoplay = true; video.playsInline = true; video.controls = false;
      return video;
    }
    var frame = document.createElement('iframe');
    frame.src = media.uri;
    frame.allow = 'autoplay; encrypted-media; fullscreen';
    frame.referrerPolicy = 'no-referrer';
    return frame;
  }

  function connect() {
    if (!/^\d{6}$/.test(code)) return;
    clearTimeout(retry);
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(proto + '//' + location.host);
    socket.onopen = function () { socket.send(JSON.stringify({ type: 'join', roomCode: code, role: 'screen' })); };
    socket.onmessage = function (event) {
      var message; try { message = JSON.parse(event.data); } catch (e) { return; }
      if (message.type === 'error') { $('error').textContent = message.message; return; }
      if (message.type === 'joined') {
        localStorage.setItem('parkcast.code', code);
        $('join').style.display = 'none';
        $('stage').style.display = 'block';
        render(message.state);
      }
      if (message.type === 'state') render(message.state);
    };
    socket.onclose = function () { retry = setTimeout(connect, 3000); };
  }

  $('code').value = code;
  $('connect').onclick = function () {
    code = $('code').value.replace(/\D/g, '');
    $('error').textContent = /^\d{6}$/.test(code) ? '' : 'The code has 6 digits.';
    if (socket) { socket.onclose = null; socket.close(); }
    connect();
  };
  $('code').addEventListener('keydown', function (event) { if (event.key === 'Enter') $('connect').click(); });
  connect();
})();
</script>
</body>
</html>
